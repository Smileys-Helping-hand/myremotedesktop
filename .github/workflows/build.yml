name: Build & Release Cross-Platform Desktop App

on:
  push:
    branches: [main, master, release/*]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release assets to GitHub Releases'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Targets (.exe via NSIS)
          - os: windows-latest
            platform: win
            arch: x64
            target_args: --win nsis:x64
            artifact_name: RemoteDesk-Windows-x64
          - os: windows-latest
            platform: win
            arch: arm64
            target_args: --win nsis:arm64
            artifact_name: RemoteDesk-Windows-arm64

          # macOS Targets (.dmg Universal / x64 / arm64)
          - os: macos-latest
            platform: mac
            arch: universal
            target_args: --mac dmg:universal
            artifact_name: RemoteDesk-macOS-Universal

          # Linux Targets (.AppImage, .pacman, .deb for Arch / Debian / Fedora)
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target_args: --linux AppImage pacman deb rpm
            artifact_name: RemoteDesk-Linux-x64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (LTS 20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Python for Node-GYP Native Compilation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Linux-specific X11 / XTest / libpng / uinput compilation dependencies
      - name: Install Linux Native Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libxtst-dev \
            libpng-dev \
            libx11-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libasound2-dev \
            libudev-dev \
            libpulse-dev \
            libnss3-dev \
            libgconf-2-4 \
            libxss1 \
            fakeroot \
            dpkg \
            rpm \
            bsdtar \
            fuse

      - name: Install NPM Dependencies
        run: npm ci

      # Native Rebuilding for @nut-tree/nut-js, robotjs, and C++ OS injection addons
      - name: Rebuild Native C++ Node Addons for Electron
        run: |
          npx --yes @electron/rebuild -f -w @nut-tree/nut-js || true
          npx --yes electron-builder install-app-deps

      - name: Run Type Checks & Linter
        run: npm run lint

      - name: Build Web Application & Transpile Electron Main Process
        run: npm run build

      - name: Package Desktop Artifacts with electron-builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Code Signing / Notarization Secrets (optional if configured in repo)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx --yes electron-builder build ${{ matrix.target_args }} --config electron-builder.yml

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.pacman
            dist-electron/*.pkg.tar.zst
            dist-electron/*.deb
            dist-electron/*.rpm
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p final-dist
          find release-artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.pacman" -o -name "*.pkg.tar.zst" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} final-dist/ \;
          ls -la final-dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
