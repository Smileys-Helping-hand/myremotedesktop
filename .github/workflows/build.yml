name: Build Desktop Installers (Windows & Linux)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback before the expensive matrix build. Also proves the two
  # signaling implementations agree, which is what lets a Windows host and a
  # Linux client meet on the same protocol.
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libdbus-1-dev \
            libssl-dev \
            build-essential \
            file

      - run: npm ci

      - name: Typecheck (app and server)
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p tsconfig.node.json

      - name: Frontend unit tests
        run: npm test

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Signaling protocol conformance (standalone relay)
        run: |
          npm run build
          npx tsx server/index.ts &
          SERVER_PID=$!
          # Wait for the relay rather than sleeping a fixed amount.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4000/network-info > /dev/null && break
            sleep 1
          done
          npx tsx scripts/check-signaling.ts http://localhost:4000
          # A host must be discoverable by Desk ID without having started a
          # screen share. That was broken once and made every cross-machine
          # connection fail with "no host is sharing that Desk ID".
          npx tsx scripts/check-host-discovery.ts http://localhost:4000
          kill $SERVER_PID

  build-tauri:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    # Creating the release needs write access to repository contents. This
    # repository defaults its Actions token to read-only, which fails only at
    # the very end — after a full build — with "Resource not accessible by
    # integration". Granted per job, so nothing else inherits write access.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      # webkit2gtk provides the webview; libxkbcommon and libwayland are needed
      # by the X11 and Wayland input-injection backends.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libdbus-1-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            patchelf

      - run: npm ci

      # Signing is what makes in-app updates possible: the updater refuses any
      # package whose minisign signature does not match the public key compiled
      # into the app, so an unsigned build simply cannot be delivered as an
      # update. Without these secrets the installers still build, but no
      # `.sig` files or `latest.json` are produced and existing installs will
      # never see the release.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # A release is only cut for tag pushes; other runs just upload artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'RemoteDesk v__VERSION__' || '' }}
          releaseBody: 'Cross-platform WebRTC remote desktop. Windows: run the .exe installer. Linux: install the .deb/.rpm, or make the .AppImage executable and run it. Existing Windows and AppImage installs update themselves from inside the app.'
          # Drafted rather than published, so a bad build is never delivered to
          # existing installs by accident. NOTE: `releases/latest` — which the
          # updater polls — ignores drafts, so a release only reaches users once
          # it is published by hand.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: remotedesk-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/rpm/*.rpm
            src-tauri/target/*/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/nsis/*.sig
            src-tauri/target/*/release/bundle/appimage/*.sig
