appId: com.remotedesk.app
productName: RemoteDesk
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 RemoteDesk WebRTC Project

directories:
  output: dist-electron
  buildResources: assets

files:
  - dist/**/*
  - dist-electron-main/**/*
  - package.json
  - "!**/*.ts"
  - "!**/*.map"
  - "!src/**/*"
  - "!electron/**/*"

# Critical for native OS binary modules like @nut-tree/nut-js
asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/@nut-tree/**"
  - "node_modules/robotjs/**"
  - "node_modules/node-gyp-build/**"

compression: maximum

# Windows Configuration (.exe via NSIS)
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: assets/icon.ico
  legalTrademarks: RemoteDesk Inc.
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: RemoteDesk
  uninstallDisplayName: RemoteDesk Client & Broadcaster
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico

# macOS Configuration (.dmg & Hardened Runtime)
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
        - universal
  icon: assets/icon.icns
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: "RemoteDesk does not require camera access for screen sharing."
    NSMicrophoneUsageDescription: "RemoteDesk does not require microphone access."
    NSScreenCaptureUsageDescription: "RemoteDesk requires Screen Recording permission to stream your desktop to authorized remote clients."
    NSAppleEventsUsageDescription: "RemoteDesk uses system events to inject remote keyboard and mouse input."

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# Linux Configuration (.AppImage, .pacman, .deb)
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: pacman
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: assets/icon.png
  category: Utility;Network;RemoteAccess;
  synopsis: Ultra-low latency WebRTC remote desktop controller
  description: High-precision cross-platform remote desktop with sub-millisecond input serialization and chunked P2P file transfers.
  maintainer: RemoteDesk Engineering Team <engineering@remotedesk.local>
  desktop:
    Name: RemoteDesk
    Comment: WebRTC Remote Desktop Client & Host
    Categories: Utility;Network;RemoteAccess;
    Terminal: false
    StartupWMClass: remotedesk
